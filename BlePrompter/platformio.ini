[platformio]
default_envs = esp32c3

; ========================================================================
; ESP32-C3 OLED Board (72×40 SSD1306, I2C)
; ========================================================================

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
build_src_filter =
    +<*>
    -<display/CydDisplay.cpp>
    -<display/Ili9341Hardware.cpp>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs =
    ../lib
lib_deps =
    olikraus/U8g2@^2.36.12
    h2zero/NimBLE-Arduino@^1.4.3

; ========================================================================
; CYB/CYD Board (ESP32-WROOM-32, ILI9341 TFT 320×240, SPI)
; ========================================================================

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter =
    +<*>
    -<display/Ssd1306Hardware.cpp>

upload_port = COM11
monitor_port = COM11
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    -D BOARD_CYD
    -D USER_SETUP_LOADED
    -include include/TFT_eSPI_Setup_CYD.h
    -I include
