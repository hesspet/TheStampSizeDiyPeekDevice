<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3ea">
    <title>BlePrompter Steuerung</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">BLE-UART</p>
          <h1>BlePrompter</h1>
        </div>
        <div class="connection-state" id="connectionState" aria-live="polite">
          <span class="state-dot" aria-hidden="true"></span>
          <span>Nicht verbunden</span>
        </div>
      </header>

      <section class="toolbar" aria-label="Verbindung und Anzeige">
        <button class="primary-action" id="connectButton" type="button">Verbinden</button>
        <button id="showAllDevicesButton" type="button">Alle BLE-Geräte anzeigen</button>
        <button id="disconnectButton" type="button" disabled>Trennen</button>
        <button id="clearButton" type="button" disabled>Anzeige löschen</button>
        <button id="helpButton" type="button" disabled>Hilfe</button>
        <label class="toggle-control">
          <input id="invertToggle" type="checkbox" disabled>
          <span>Invertiert</span>
        </label>
      </section>

      <nav class="mode-tabs" aria-label="Betriebsarten">
        <button class="mode-tab active" type="button" data-mode="arrows" aria-pressed="true">Pfeile</button>
        <button class="mode-tab" type="button" data-mode="cards" aria-pressed="false">Karten</button>
        <button class="mode-tab" type="button" data-mode="symbols" aria-pressed="false">Symbole</button>
        <button class="mode-tab" type="button" data-mode="esp" aria-pressed="false">ESP</button>
      </nav>

      <section class="mode-panel active" id="arrowsPanel" data-panel="arrows" aria-label="Pfeile">
        <div class="compass-grid" aria-label="Kompassrose">
          <button class="command-button direction-button north-west" type="button" data-command="ANW" disabled>NW</button>
          <button class="command-button direction-button north" type="button" data-command="AN" disabled>N</button>
          <button class="command-button direction-button north-east" type="button" data-command="ANE" disabled>NO</button>
          <button class="command-button direction-button west" type="button" data-command="AW" disabled>W</button>
          <div class="compass-center" aria-hidden="true">+</div>
          <button class="command-button direction-button east" type="button" data-command="AE" disabled>O</button>
          <button class="command-button direction-button south-west" type="button" data-command="ASW" disabled>SW</button>
          <button class="command-button direction-button south" type="button" data-command="AS" disabled>S</button>
          <button class="command-button direction-button south-east" type="button" data-command="ASE" disabled>SO</button>
        </div>
      </section>

      <section class="mode-panel" id="cardsPanel" data-panel="cards" aria-label="Karten">
        <div class="suit-selector" role="group" aria-label="Farbe">
          <button class="suit-button active" type="button" data-suit-code="H" aria-pressed="true">
            <span class="suit-mark heart">♥</span>
            <span>Herz</span>
          </button>
          <button class="suit-button" type="button" data-suit-code="D" aria-pressed="false">
            <span class="suit-mark diamond">♦</span>
            <span>Karo</span>
          </button>
          <button class="suit-button" type="button" data-suit-code="C" aria-pressed="false">
            <span class="suit-mark club">♣</span>
            <span>Kreuz</span>
          </button>
          <button class="suit-button" type="button" data-suit-code="S" aria-pressed="false">
            <span class="suit-mark spade">♠</span>
            <span>Pik</span>
          </button>
        </div>

        <div class="rank-grid" aria-label="Kartenwerte">
          <button class="command-button rank-button" type="button" data-rank-code="1" disabled>Ass</button>
          <button class="command-button rank-button" type="button" data-rank-code="2" disabled>2</button>
          <button class="command-button rank-button" type="button" data-rank-code="3" disabled>3</button>
          <button class="command-button rank-button" type="button" data-rank-code="4" disabled>4</button>
          <button class="command-button rank-button" type="button" data-rank-code="5" disabled>5</button>
          <button class="command-button rank-button" type="button" data-rank-code="6" disabled>6</button>
          <button class="command-button rank-button" type="button" data-rank-code="7" disabled>7</button>
          <button class="command-button rank-button" type="button" data-rank-code="8" disabled>8</button>
          <button class="command-button rank-button" type="button" data-rank-code="9" disabled>9</button>
          <button class="command-button rank-button" type="button" data-rank-code="X" disabled>10</button>
          <button class="command-button rank-button" type="button" data-rank-code="J" disabled>Bube</button>
          <button class="command-button rank-button" type="button" data-rank-code="Q" disabled>Dame</button>
          <button class="command-button rank-button" type="button" data-rank-code="K" disabled>König</button>
        </div>

        <div class="joker-row" aria-label="Joker">
          <button class="command-button" type="button" data-command="CJ1" disabled>Joker 1</button>
          <button class="command-button" type="button" data-command="CJ2" disabled>Joker 2</button>
        </div>
      </section>

      <section class="mode-panel" id="symbolsPanel" data-panel="symbols" aria-label="Symbole">
        <form class="symbol-form" id="symbolForm">
          <label for="symbolInput">Symbol</label>
          <div class="symbol-input-row">
            <input id="symbolInput" name="symbolInput" type="text" maxlength="2" autocomplete="off" inputmode="text" disabled>
            <button class="primary-action" id="sendSymbolButton" type="submit" disabled>Senden</button>
          </div>
        </form>
      </section>

      <section class="mode-panel" id="espPanel" data-panel="esp" aria-label="ESP-Symbole">
        <div class="esp-symbol-grid" aria-label="ESP-Symbole">
          <button class="command-button esp-symbol-button" type="button" data-command="EC" disabled>
            <span class="esp-symbol-shape esp-symbol-circle" aria-hidden="true"></span>
            <span>Kreis</span>
          </button>
          <button class="command-button esp-symbol-button" type="button" data-command="EG" disabled>
            <span class="esp-symbol-shape esp-symbol-cross" aria-hidden="true"></span>
            <span>Kreuz</span>
          </button>
          <button class="command-button esp-symbol-button" type="button" data-command="EW" disabled>
            <span class="esp-symbol-shape esp-symbol-waves" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </span>
            <span>Wellen</span>
          </button>
          <button class="command-button esp-symbol-button" type="button" data-command="EQ" disabled>
            <span class="esp-symbol-shape esp-symbol-square" aria-hidden="true"></span>
            <span>Quadrat</span>
          </button>
          <button class="command-button esp-symbol-button" type="button" data-command="ES" disabled>
            <span class="esp-symbol-shape esp-symbol-star" aria-hidden="true"></span>
            <span>Stern</span>
          </button>
        </div>
      </section>

      <section class="status-panel" aria-label="Status">
        <div class="status-line">
          <span>Letzter Befehl</span>
          <output id="lastCommandOutput">-</output>
        </div>
        <div class="status-line">
          <span>Antwort</span>
          <output id="lastResponseOutput">-</output>
        </div>
        <ol class="message-log" id="messageLog" aria-live="polite"></ol>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
